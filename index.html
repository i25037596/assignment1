  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Shangqiu</title>
  <style>
    :root {
      --deep-blue: #1F2A30;
      --blue-gray: #4A5C63;
      --vermilion: #9E2B25;
      --ivory: #F4F1EA;
      --warm-gold: #C2A878;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        linear-gradient(rgba(31, 42, 48, 0.60), rgba(31, 42, 48, 0.72)),
        url("images/0.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ivory);
    }

    .hero-box {
      width: min(88%, 760px);
      padding: 60px 40px;
      text-align: center;
      background: rgba(31, 42, 48, 0.72);
      border: 1.5px solid rgba(194, 168, 120, 0.85);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
    }

    .small-title {
      letter-spacing: 4px;
      text-transform: uppercase;
      font-size: 0.9rem;
      color: var(--warm-gold);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4.8rem);
      line-height: 1.1;
      margin-bottom: 18px;
      color: var(--ivory);
    }

    .subtitle {
      max-width: 600px;
      margin: 0 auto 34px;
      font-size: 1.05rem;
      line-height: 1.8;
      color: rgba(244, 241, 234, 0.9);
    }

    .enter-btn {
      display: inline-block;
      padding: 15px 36px;
      text-decoration: none;
      background: var(--vermilion);
      color: var(--ivory);
      border: 2px solid var(--vermilion);
      border-radius: 999px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      transition: 0.3s ease;
    }

    .enter-btn:hover {
      background: transparent;
      border-color: var(--warm-gold);
      color: var(--warm-gold);
      transform: translateY(-2px);
    }

    .bottom-note {
      margin-top: 26px;
      font-size: 0.9rem;
      color: rgba(244, 241, 234, 0.75);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="hero-box">
    <p class="small-title">Ancient City of China</p>
    <h1>Welcome to Shangqiu</h1>
    <p class="subtitle">
      A city where history, culture, and everyday life quietly meet.
      Step into Shangqiu and discover an ancient destination shaped by time.
    </p>
    <a href="discover.html" class="enter-btn">Explore Shangqiu</a>
    <p class="bottom-note">Click to enter the tourism page</p>
  </div>
</body>
</html>
